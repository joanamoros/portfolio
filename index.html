<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f6f3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#12141a" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Joan Amorós — Junior QA Engineer en NTT DATA (software testing, test automation y performance). Graduado en Ingeniería Informática y estudiante del Máster en Ciencia de Datos." />
    <meta name="author" content="Joan Amorós" />

    <!-- Open Graph / redes sociales -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Joan Amorós — Junior QA Engineer" />
    <meta property="og:description" content="Portfolio de Joan Amorós: proyectos, stack tecnológico y contacto." />
    <meta property="og:locale" content="es_ES" />

    <!-- Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Sora:wght@600;700&display=swap" rel="stylesheet" />

    <title>Joan Amorós — Junior QA Engineer</title>
  </head>
  <body>
    <!-- Aplica el tema antes del primer pintado para evitar el parpadeo claro/oscuro -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.body.className = t;
        } catch (e) {
          document.body.className = "light";
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
